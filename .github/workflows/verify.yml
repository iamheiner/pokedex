name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore PokemonTwo.slnx --locked-mode
      - run: dotnet test PokemonTwo.slnx -c Release --no-restore
      - run: docker build --tag pokemon-api:verify .
