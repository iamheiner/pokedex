services:
  api:
    build: .
    ports:
      - "127.0.0.1:${POKEMON_API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiDocumentation__Enabled: "true"
      Authentication__Authority: http://localhost:${KEYCLOAK_PORT:-18080}/realms/pokemon
      Authentication__MetadataAddress: http://keycloak:8080/realms/pokemon/.well-known/openid-configuration
      Authentication__Audience: pokemon-api
      Authentication__DocumentationClientSecret: ${POKEMON_DOCUMENTATION_SECRET:-pokemon_docs_local_only}
      Authentication__RequireHttpsMetadata: "false"
      BattlePersistence__Provider: Postgres
      ConnectionStrings__Battles: "Host=postgres;Database=pokemon;Username=pokemon;Password=${POSTGRES_PASSWORD:-pokemon_local_only};GSS Encryption Mode=Disable"
      OTEL_SERVICE_NAME: pokemon-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
      keycloak:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pokemon
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon_local_only}
    volumes:
      - pokemon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-tests:
    profiles: [tests]
    build:
      context: .
      target: postgres-tests
    environment:
      POKEMON_POSTGRES_TEST_CONNECTION: "Host=postgres;Database=pokemon;Username=pokemon;Password=${POSTGRES_PASSWORD:-pokemon_local_only};GSS Encryption Mode=Disable"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_db_local_only}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      POKEMON_API_PORT: ${POKEMON_API_PORT:-5080}
      POKEMON_DOCUMENTATION_SECRET: ${POKEMON_DOCUMENTATION_SECRET:-pokemon_docs_local_only}
      POKEMON_TRAINER_PASSWORD: ${POKEMON_TRAINER_PASSWORD:-trainer_local_only}
      POKEMON_CLIENT_SECRET: ${POKEMON_CLIENT_SECRET:-pokemon_client_local_only}
    volumes:
      - ./docker/keycloak/pokemon-realm.json:/opt/keycloak/data/import/pokemon-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_db_local_only}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 5s
      retries: 30

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.3
    ports:
      - "127.0.0.1:${ASPIRE_DASHBOARD_PORT:-18888}:18888"
    environment:
      # Uso local: UI en loopback y OTLP solo en la red de Compose.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

volumes:
  pokemon-postgres:
  keycloak-postgres:
